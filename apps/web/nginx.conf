server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Runtime config, written into the volume by the deployer or config-init. Never
    # cache it: rebuilding the stack changes the factory address.
    location /runtime/ {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location /assets/ {
        # Vite hashes filenames, so caching forever is safe.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Hash routing, so every path serves index.html.
    location / {
        try_files $uri /index.html;
    }
}
